<script>
(function(){
'use strict';
var MODULE_ID='money',APP_VERSION='0.4.0',SCHEMA_VERSION=2,KEY='alex.money.state';
var todayISO=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var nowISO=function(){return new Date().toISOString()};
var uid=function(p){return (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var parseDate=function(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]||1,12,0,0)};
var dateISO=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var monthKey=function(x){var d=x instanceof Date?x:parseDate(x);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
var monthLabel=function(k){var d=parseDate(k+'-01');return d.toLocaleDateString('it-IT',{month:'long',year:'numeric'})};

var addDays=function(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return dateISO(d)};
var addMonths=function(s,n){var d=parseDate(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dateISO(d)};
var addYears=function(s,n){var d=parseDate(s),m=d.getMonth(),day=d.getDate();d.setDate(1);d.setFullYear(d.getFullYear()+n);d.setMonth(m);var last=new Date(d.getFullYear(),m+1,0).getDate();d.setDate(Math.min(day,last));return dateISO(d)};
function defaults(){return {moduleId:MODULE_ID,appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,settings:{currency:'EUR',monthlyBudget:0,selectedMonth:monthKey(new Date()),lastAccountId:'main'},accounts:[{id:'main',name:'Conto principale',type:'spending',initialBalance:0,active:true},{id:'cash',name:'Contanti',type:'cash',initialBalance:0,active:true}],categories:{expense:['Alimentari','Casa','Trasporti','Salute','Svago','Abbonamenti','Shopping','Altro'],income:['Stipendio','Rimborsi','Vendite','Altro']},transactions:[],recurrences:[],budgets:[],goals:[],wishlist:[],metadata:{createdAt:nowISO(),updatedAt:nowISO()}}}
function normalizeState(s){var d=defaults(),x=Object.assign({},d,s||{});x.settings=Object.assign({},d.settings,(s&&s.settings)||{});x.categories=Object.assign({},d.categories,(s&&s.categories)||{});x.metadata=Object.assign({},d.metadata,(s&&s.metadata)||{});var src=(s&&Array.isArray(s.accounts)&&s.accounts.length)?s.accounts:d.accounts;x.accounts=src.map(function(a,i){return {id:a.id||uid('acc'),name:a.name||('Conto '+(i+1)),type:a.type||(a.id==='cash'?'cash':'spending'),initialBalance:Number(a.initialBalance)||0,active:a.active!==false}});x.transactions=Array.isArray(s&&s.transactions)?s.transactions.map(function(t){return Object.assign({accountId:'main'},t)}):[];x.recurrences=Array.isArray(s&&s.recurrences)?s.recurrences:[];x.budgets=Array.isArray(s&&s.budgets)?s.budgets:[];x.goals=Array.isArray(s&&s.goals)?s.goals:[];x.wishlist=Array.isArray(s&&s.wishlist)?s.wishlist:[];if(Number((s&&s.schemaVersion)||1)<2&&(!s.budgets||!s.budgets.length)&&Number(((s&&s.settings)||{}).monthlyBudget)===1200)x.settings.monthlyBudget=0;x.moduleId=MODULE_ID;x.appVersion=APP_VERSION;x.schemaVersion=SCHEMA_VERSION;return x}
function load(){try{var raw=localStorage.getItem(KEY);if(!raw)return defaults();var s=JSON.parse(raw);if(!s||s.moduleId!==MODULE_ID)return defaults();return normalizeState(s)}catch(e){return defaults()}}
var state=load();
function save(){state.appVersion=APP_VERSION;state.schemaVersion=SCHEMA_VERSION;state.metadata.updatedAt=nowISO();localStorage.setItem(KEY,JSON.stringify(state));}
function money(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:state.settings.currency||'EUR'}).format(Number(n)||0)}
function accountById(id){return state.accounts.find(function(a){return a.id===id})}
function accountName(id){var a=accountById(id);return a?a.name:'Conto non disponibile'}
function accountTypeLabel(t){return t==='savings'?'Risparmio':t==='cash'?'Contanti':t==='other'?'Altro':'Spese'}
function activeAccounts(){return state.accounts.filter(function(a){return a.active!==false})}
function accountOptions(selected){var list=activeAccounts().slice();var old=accountById(selected);if(old&&old.active===false&&!list.some(function(a){return a.id===old.id}))list.push(old);return options(list,selected)}
function accountBalance(id){var a=accountById(id),v=a?Number(a.initialBalance)||0:0;state.transactions.forEach(function(t){var n=Number(t.amount)||0;if(t.type==='income'&&t.accountId===id)v+=n;else if(t.type==='expense'&&t.accountId===id)v-=n;else if(t.type==='transfer'&&t.toAccountId){var from=t.fromAccountId||t.accountId;if(from===id)v-=n;if(t.toAccountId===id)v+=n}});return v}
function accountMonthStats(id,k){var inc=0,exp=0;txForMonth(k).forEach(function(t){var n=Number(t.amount)||0;if(t.type==='income'&&t.accountId===id)inc+=n;if(t.type==='expense'&&t.accountId===id)exp+=n});return {income:inc,expense:exp}}
function categoryBreakdown(k){var map={};txForMonth(k).forEach(function(t){if(t.type==='expense')map[t.category||'Altro']=(map[t.category||'Altro']||0)+(Number(t.amount)||0)});return Object.keys(map).map(function(name){return {name:name,value:map[name]}}).sort(function(a,b){return b.value-a.value})}
function txForMonth(k){return state.transactions.filter(function(t){return monthKey(t.date)===k})}
function totals(k){var tx=txForMonth(k),income=0,expense=0;tx.forEach(function(t){if(t.type==='income')income+=Number(t.amount)||0;else if(t.type==='expense')expense+=Number(t.amount)||0});return {income:income,expense:expense,balance:income-expense}}
function budgetTotal(k){var row=state.budgets.find(function(b){return b.month===k});return row?Number(row.amount||0):Number(state.settings.monthlyBudget||0)}
function monthlyExpense(k){return totals(k).expense}
function nextOccurrence(r,s){var n=Math.max(1,Number(r.interval)||1);if(r.frequency==='weekly')return addDays(s,7*n);if(r.frequency==='annual')return addYears(s,n);if(r.frequency==='custom')return addDays(s,n);return addMonths(s,n)}
function occurrenceDates(r,until){var out=[],d=r.startDate,guard=0;if(!d)return out;while(d<=until&&guard<1000){if(!r.endDate||d<=r.endDate)out.push(d);else break;d=nextOccurrence(r,d);guard++}return out}
function generateRecurrences(){var today=todayISO(),added=0;state.recurrences.filter(function(r){return r.status==='active'}).forEach(function(r){occurrenceDates(r,today).forEach(function(d){var exists=state.transactions.some(function(t){return t.recurrenceId===r.id&&t.occurrenceDate===d});if(!exists){state.transactions.push({id:uid('tx'),type:r.type||'expense',amount:Number(r.amount)||0,date:d,category:r.category||'Abbonamenti',subcategory:r.subcategory||'',accountId:r.accountId||'main',note:r.name||'Ricorrenza',recurrenceId:r.id,occurrenceDate:d,createdAt:nowISO()});added++}})});if(added)save();return added}
function upcoming(days){var from=todayISO(),to=addDays(from,days||30),out=[];state.recurrences.filter(function(r){return r.status==='active'}).forEach(function(r){occurrenceDates(r,to).forEach(function(d){if(d>from&&(!r.endDate||d<=r.endDate))out.push({date:d,name:r.name,amount:Number(r.amount)||0,type:r.type||'expense',id:r.id})})});return out.sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,12)}
function annualized(){return state.recurrences.filter(function(r){return r.status==='active'&&(r.type||'expense')==='expense'}).reduce(function(sum,r){var a=Number(r.amount)||0,n=Math.max(1,Number(r.interval)||1);if(r.frequency==='weekly')return sum+a*(52/n);if(r.frequency==='annual')return sum+a/n;if(r.frequency==='custom')return sum+a*(365/n);return sum+a*(12/n)},0)}
function anomalies(){var exp=state.transactions.filter(function(t){return t.type==='expense'}),by={};exp.forEach(function(t){(by[t.category]||(by[t.category]=[])).push(Number(t.amount)||0)});return exp.filter(function(t){var arr=by[t.category]||[];if(arr.length<4)return false;var avg=(arr.reduce(function(a,b){return a+b},0)-Number(t.amount))/(arr.length-1);return avg>0&&Number(t.amount)>avg*1.8&&Number(t.amount)>40}).sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,5)}
function previousMonths(n){var out=[],d=new Date();d.setDate(1);for(var i=n-1;i>=0;i--){var x=new Date(d);x.setMonth(x.getMonth()-i);out.push(monthKey(x))}return out}
function percent(a,b){return b>0?Math.round(a/b*100):0}
function toast(msg){var el=document.getElementById('toast');el.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=''},2300)}
